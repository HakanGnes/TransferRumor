services:
  - type: web
    name: transferrumor-api
    runtime: python
    plan: free
    region: frankfurt          # Turkiye'ye en yakin bolge
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Frontend adresini Vercel'den aldiktan sonra Render panelinden
      # bu degeri guncelle. Birden fazla adres virgulle ayrilir.
      - key: ALLOWED_ORIGINS
        sync: false
